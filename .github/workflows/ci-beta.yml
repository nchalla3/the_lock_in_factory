name: CI/CD Pipeline (Beta Flutter)

on:
  workflow_dispatch:  # Manual trigger for testing
  schedule:
    - cron: '0 2 * * *'  # Run daily at 2 AM UTC for testing

jobs:
  test-beta:
    name: Test with Beta Flutter
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter (Beta Channel)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.3'  # As suggested in the error message
        channel: 'beta'
        cache: true
        
    - name: Verify Flutter and Dart versions
      run: |
        flutter --version
        dart --version
        echo "Checking Dart SDK version compatibility..."
        
    - name: Check Dart version compatibility
      run: |
        DART_VERSION=$(dart --version 2>&1 | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+' | head -1)
        echo "Current Dart version: $DART_VERSION"
        echo "Required Dart version: ^3.8.1"
        if [[ $(echo "$DART_VERSION 3.8.1" | tr " " "\n" | sort -V | head -1) != "3.8.1" ]]; then
          echo "✓ Dart version $DART_VERSION meets requirement ^3.8.1"
        else
          echo "✗ Dart version $DART_VERSION does not meet requirement ^3.8.1"
          exit 1
        fi
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Analyze code
      run: flutter analyze
      
    - name: Run tests
      run: flutter test
      
    - name: Build APK
      run: flutter build apk --release