name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.35.3'
  JAVA_VERSION: '17'
  XCODE_VERSION: '15.4'

jobs:
  # Job 1: Code Quality and Testing
  test:
    name: Test & Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Verify Flutter installation
      run: flutter doctor -v
      
    - name: Run code analysis
      run: flutter analyze
      
    - name: Check code formatting
      run: dart format .
      
    - name: Run unit tests
      run: flutter test --coverage --reporter=github
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: coverage/lcov.info
        fail_ci_if_error: false

  # Job 2: Build Android
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Setup Google Services configuration
      run: |
        if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
          echo "✅ Google Services JSON configured for Android"
        else
          echo "⚠️  Warning: GOOGLE_SERVICES_JSON_BASE64 secret not found. Firebase features may not work."
        fi
      
    - name: Setup Android signing (if secrets available)
      if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      run: |
        if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
          echo "storeFile=keystore.jks" >> android/key.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
        fi
        
    - name: Build Android APK
      run: flutter build apk --release
      
    - name: Build Android App Bundle
      if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      run: flutter build appbundle --release
      
    - name: Upload Android artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-builds
        path: |
          build/app/outputs/flutter-apk/app-release.apk
          build/app/outputs/bundle/release/app-release.aab
        retention-days: 30

  # Job 3: Build iOS
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: test
    timeout-minutes: 60
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ env.XCODE_VERSION }}
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Setup Google Services configuration
      run: |
        if [ -n "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" ]; then
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > ios/Runner/GoogleService-Info.plist
          echo "✅ GoogleService-Info.plist configured for iOS"
        else
          echo "⚠️  Warning: GOOGLE_SERVICE_INFO_PLIST_BASE64 secret not found. Firebase features may not work."
        fi
      
    - name: Install CocoaPods
      run: |
        cd ios
        pod install --repo-update
        
    - name: Setup iOS signing (if secrets available)
      if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      run: |
        if [ -n "${{ secrets.IOS_CERTIFICATE_BASE64 }}" ]; then
          # Import certificate and provisioning profile
          echo "${{ secrets.IOS_CERTIFICATE_BASE64 }}" | base64 --decode > ios/certificate.p12
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > ios/profile.mobileprovision
          
          # Install certificate
          security create-keychain -p "" build.keychain
          security import ios/certificate.p12 -t agg -k build.keychain -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" -A
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          
          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp ios/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
        fi
        
    - name: Build iOS (no signing for PRs)
      if: ${{ github.event_name == 'pull_request' }}
      run: flutter build ios --release --no-codesign
      
    - name: Build iOS Archive
      if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      run: |
        flutter build ipa --release
        
    - name: Upload iOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ios-builds
        path: |
          build/ios/ipa/*.ipa
        retention-days: 30

  # Job 4: Build macOS
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: test
    timeout-minutes: 45
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        
    - name: Enable macOS desktop
      run: flutter config --enable-macos-desktop
      
    - name: Install dependencies
      run: flutter pub get
      
    - name: Setup Google Services configuration
      run: |
        if [ -n "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" ]; then
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > macos/Runner/GoogleService-Info.plist
          echo "✅ GoogleService-Info.plist configured for macOS"
        else
          echo "⚠️  Warning: GOOGLE_SERVICE_INFO_PLIST_BASE64 secret not found. Firebase features may not work."
        fi
      
    - name: Install CocoaPods for macOS
      run: |
        cd macos
        pod install --repo-update
        
    - name: Build macOS app
      run: flutter build macos --release
      
    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-builds
        path: build/macos/Build/Products/Release/the_lock_in_factory.app
        retention-days: 30

  # Job 5: Build Web
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Build web app
      run: flutter build web --release
      
    - name: Upload web artifacts
      uses: actions/upload-artifact@v4
      with:
        name: web-builds
        path: build/web/
        retention-days: 30

  # Job 6: Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  # Job 7: Deploy (only on main branch)
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build-android, build-ios, build-macos, build-web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Deploy to Firebase Hosting (Web)
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        channelId: live
        projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'

  # Job 8: Complete
  complete:
    name: Pipeline Complete
    runs-on: ubuntu-latest
    needs: [test, build-android, build-ios, build-macos, build-web]
    if: always()
    
    steps:
    - name: Check pipeline status
      run: |
        if [[ "${{ needs.test.result }}" == "success" && 
              "${{ needs.build-android.result }}" == "success" && 
              "${{ needs.build-ios.result }}" == "success" && 
              "${{ needs.build-macos.result }}" == "success" && 
              "${{ needs.build-web.result }}" == "success" ]]; then
          echo "✅ All pipeline jobs completed successfully!"
        else
          echo "❌ Some pipeline jobs failed or were cancelled"
          exit 1
        fi
