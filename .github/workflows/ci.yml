name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 'latest'
        channel: 'stable'
        cache: true
        
    - name: Verify Flutter and Dart versions
      run: |
        flutter --version
        dart --version
        echo "Checking Dart SDK version compatibility..."
        dart --version | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+' | head -1
        
    - name: Check Dart version compatibility
      run: |
        DART_VERSION=$(dart --version 2>&1 | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+' | head -1)
        echo "Current Dart version: $DART_VERSION"
        echo "Required Dart version: ^3.8.1"
        if [[ $(echo "$DART_VERSION 3.8.1" | tr " " "\n" | sort -V | head -1) != "3.8.1" ]]; then
          echo "✓ Dart version $DART_VERSION meets requirement ^3.8.1"
        else
          echo "✗ Dart version $DART_VERSION does not meet requirement ^3.8.1"
          echo "Will attempt dependency resolution anyway..."
        fi
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Analyze code
      run: flutter analyze
      
    - name: Run tests
      run: flutter test
      
    - name: Build APK
      run: flutter build apk --release
      
    - name: Build Web
      run: flutter build web --release

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 'latest'
        channel: 'stable'
        cache: true
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build Web for deployment
      run: flutter build web --release
      
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: success()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build/web