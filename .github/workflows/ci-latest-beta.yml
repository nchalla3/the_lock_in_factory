name: CI/CD Pipeline (Latest Beta)

on:
  workflow_dispatch:  # Manual trigger for testing
  push:
    branches: [ copilot/fix-12 ]  # Test on this branch
  pull_request:
    branches: [ main, develop ]

jobs:
  test-latest-beta:
    name: Test with Latest Beta Flutter
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter (Latest Beta)
      uses: subosito/flutter-action@v2
      with:
        channel: 'beta'
        cache: true
        
    - name: Verify Flutter and Dart versions
      run: |
        echo "=== Flutter Version ==="
        flutter --version
        echo "=== Dart Version ==="
        dart --version
        echo "======================"
        
    - name: Check Dart version compatibility
      run: |
        DART_VERSION=$(dart --version 2>&1 | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+' | head -1)
        echo "Current Dart version: $DART_VERSION"
        echo "Required Dart version: ^3.8.1"
        
        # Convert versions to comparable format (major.minor.patch)
        DART_MAJOR=$(echo $DART_VERSION | cut -d. -f1)
        DART_MINOR=$(echo $DART_VERSION | cut -d. -f2)
        DART_PATCH=$(echo $DART_VERSION | cut -d. -f3)
        
        echo "Parsed Dart version: $DART_MAJOR.$DART_MINOR.$DART_PATCH"
        
        # Check if version meets requirement (>=3.8.1)
        if [ "$DART_MAJOR" -gt 3 ] || \
           ([ "$DART_MAJOR" -eq 3 ] && [ "$DART_MINOR" -gt 8 ]) || \
           ([ "$DART_MAJOR" -eq 3 ] && [ "$DART_MINOR" -eq 8 ] && [ "$DART_PATCH" -ge 1 ]); then
          echo "✓ Dart version $DART_VERSION meets requirement ^3.8.1"
        else
          echo "✗ Dart version $DART_VERSION does not meet requirement ^3.8.1"
          echo "Will still attempt dependency resolution to see actual error..."
        fi
        
    - name: Get dependencies
      run: |
        echo "Attempting to resolve dependencies..."
        flutter pub get
      
    - name: Analyze code
      run: flutter analyze
      
    - name: Run tests
      run: flutter test
      
    - name: Build APK
      run: flutter build apk --release